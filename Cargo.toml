[package]
name = "mpktransport"
version = "0.1.0"
edition = "2024"
default-run = "app"

[dependencies]
anyhow = "1.0.102"
csv = "1.4.0"
eframe = "0.34.3"
egui = "0.34.3"
egui_extras = "0.34.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0"
walkers = "0.53.0"
transport = {
    git = "https://github.com/akwasniewski/transport",
    branch = "main"  
}
